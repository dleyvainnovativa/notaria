<!DOCTYPE html>
<html lang="en" class="h-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 3-Row Layout (Fixed)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .content-fill {
            flex-grow: 1;
            background-image: url('http://localhost/recuerdo/public/storage/memorials/profile-images/5cjds886cZzu3ZB6J3QxD0fHS6DIZHl1YSYkABYu.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

    </style>
</head>

<body class="h-100">

    <div class="d-flex flex-column h-100 col-xl-5 col-12 mx-auto">
        <div class="row g-0">
            <div class="col">
                <nav id="scroll-navbar-info"
                    class="navbar h-100 w-100 navbar-dark bg-dark shadow-sm transition py-3 scroll-navbar">
                    <div class="container">
                        <div class="container">
                            <div class="col-12 col-md-10 col-lg-10 col-xl-5 mx-auto">
                                <div class="row">
                                    <div class="col-4 my-auto">
                                        <a
                                            class="d-flex align-items-center gap-2 text-muted text-decoration-none fw-bold">
                                            Info
                                        </a>
                                    </div>
                                    <div class="col-4 mx-auto text-center my-auto">
                                        <div class="mx-auto icon-flip" id="themeToggle" onclick="toggleIcon(this)">
                                            <img class="icon icon-light my-auto"
                                                src="http://localhost/recuerdo/public/img/icon_dark2.png" width="50"
                                                alt="">
                                        </div>
                                    </div>

                                    <div class="col-4 ms-auto text-end my-auto">
                                        <button class="btn btn-primary btn-sm" data-bs-toggle="offcanvas"
                                            data-bs-target="#infoBottomSheet" aria-controls="infoBottomSheet">
                                            <i class="fas fa-circle-info" aria-hidden="true"></i>
                                        </button>
                                        <button class="btn btn-primary btn-sm">
                                            <i class="fas fa-share-nodes" aria-hidden="true"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </div>

        <div class="row content-fill g-0">
        </div>

        <div class="row g-0">
            <div class="col">
                <div class="text-dark text-start">
                    <h1 class="title display mb-0">
                        Nelly De La Torre
                    </h1>
                    <p class="mb-1">
                        Prueba 2
                    </p>
                    <small class="text-muted fw-light">
                        1945–2022
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
